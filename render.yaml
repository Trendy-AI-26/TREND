# LEGACY: historical Render-only deployment; do not deploy this manifest.
# It predates the PostgreSQL/S3 migration. Use docker-compose.coolify.yml
# and docs/deploy-coolify.md for the supported deployment.
services:
  - type: web
    name: trendy-ai-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Secret values are entered in the Render Dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false

      # Non-secret runtime configuration.
      - key: STORAGE_BUCKET
        value: brand-assets
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
